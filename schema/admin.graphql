"""
Where a quote stands. There is no decline: the owner only accepts, one quote
per task.
"""
enum QuoteStatus {
  """
  Waiting for the owner. It stays PENDING while another worker is booked and
  after that booking completes (`Task.bookingStatus`). If that booking ends
  early and the owner reopens the task, it can be accepted.
  """
  PENDING
  """
  The owner accepted it and booked this worker. One per task. It stays
  ACCEPTED after the booking ends, unless the owner reopens the task
  (CLOSED).
  """
  ACCEPTED
  """
  The worker withdrew it.
  """
  WITHDRAWN
  """
  Replaced by a newer quote from the same worker on the same task (its own
  `QUOTE_RECEIVED` flash carries the new one). Product reads omit EXPIRED rows.
  """
  EXPIRED
  """
  The booking from this quote ended early (cancelled, or ended because the
  worker's account is suspended) and the owner reopened the task. It can't
  be accepted again.
  """
  CLOSED
}

"""
A worker's offer on a task. `Task.quotes` decides who sees which quotes. Every
quote a viewer gets has its price, times and message; who sent it
(`workerUserId`, `worker`) is only there for the task owner, that worker and
