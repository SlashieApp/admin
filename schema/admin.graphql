}

type Order
  @entity(
    additionalFields: [
      { path: "taskId", type: "IdDoc['_id']" }
      { path: "quoteId", type: "IdDoc['_id']" }
      { path: "customerUserId", type: "IdDoc['_id']" }
      { path: "workerUserId", type: "IdDoc['_id']" }
      { path: "agreedPrice", type: "{ amountPence: number, currency: string }" }
      { path: "snapshot", type: "Record<string, unknown>" }
      { path: "bookedStart", type: "Date" }
      { path: "bookedEnd", type: "Date | null" }
      {
        path: "pendingRequest"
        type: "{ kind: 'RESCHEDULE' | 'CANCEL', requestedBy: 'CUSTOMER' | 'WORKER', requestedAt: Date, proposedSlots: Array<{ id: IdDoc['_id'], start: Date, end: Date | null }> } | null"
      }
      {
        path: "rescheduleHistory"
        type: "Array<{ previousStart: Date, previousEnd: Date | null, start: Date, end: Date | null, requestedBy: 'CUSTOMER' | 'WORKER', confirmedAt: Date }>"
      }
      {
        path: "closeActions"
        type: "{ CUSTOMER: { kind: 'DONE' | 'FAILED', at: Date, failedReason: string | null } | null, WORKER: { kind: 'DONE' | 'FAILED', at: Date, failedReason: string | null } | null }"
      }
      { path: "autoDoneAt", type: "Date | null" }
      { path: "closedAt", type: "Date | null" }
      { path: "rev", type: "number" }
    ]
  )
{
  id: ID! @id
  taskId: ID!
  quoteId: ID!
  customerUserId: ID!
  workerUserId: ID!
  status: OrderStatus! @column
  agreedPrice: OrderAgreedPrice!
  snapshot: OrderSnapshot!
  """
  Exact booked start (the accepted or rescheduled slot). Gates Done / Failed.
  """
  bookedStart: DateTime!
  bookedEnd: DateTime
  pendingRequest: OrderPendingRequest
  rescheduleHistory: [OrderReschedule!]!
  myCloseAction: OrderCloseAction
  counterpartyCloseAction: OrderCloseAction
  """
  When the other party is auto-marked Done (7 days after a one-sided Done).
  """
  autoDoneAt: DateTime
  """
  When the order reached COMPLETED or CANCELLED.
  """
  closedAt: DateTime
  createdAt: DateTime! @column(overrideType: "Date")
  task: Task!
}

input MyOrdersFilter {
  status: [OrderStatus!]
  role: OrderPartyRole
}

